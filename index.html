<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Klyv — an accent-led React component library</title>
    <meta
      name="description"
      content="614 accessible React components and 11 finished screens that take their entire personality from a single colour. Live previews, real source, copy and go."
    />
    <link rel="canonical" href="https://klyvui.xyz/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Klyv" />
    <meta property="og:url" content="https://klyvui.xyz/" />
    <meta property="og:title" content="Klyv — an accent-led React component library" />
    <meta
      property="og:description"
      content="614 accessible React components and 11 finished screens that take their entire personality from a single colour."
    />
    <!-- The share card. Absolute, because the crawlers that read it do not resolve relative URLs. -->
    <meta property="og:image" content="https://klyvui.xyz/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Klyv: every component your product needs, themed by one colour" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Klyv — an accent-led React component library" />
    <meta
      name="twitter:description"
      content="614 accessible React components and 11 finished screens that take their entire personality from a single colour."
    />
    <meta name="twitter:image" content="https://klyvui.xyz/og.jpg" />
    <!-- What the library is, for the search engines that read structured data. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "Klyv",
        "description": "An accent-led React component library: 614 accessible components and 11 finished screens, themed by a single colour.",
        "url": "https://klyvui.xyz/",
        "codeRepository": "https://github.com/Klyv-UI/klyv",
        "programmingLanguage": "TypeScript",
        "runtimePlatform": "React",
        "license": "https://opensource.org/licenses/MIT"
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before the stylesheet paints, so a reader who chose dark, or a
      // theme of their own, never sees the default flash first. Deliberately
      // inline and dependency-free: anything deferred is already too late.
      try {
        var root = document.documentElement
        var mode = localStorage.getItem('klyv:mode')
        if (mode === 'dark' || mode === 'light') {
          root.dataset.theme = mode
        }

        // The saved theme. saveTheme keeps five choices, e.g.
        // `8b5cf6.zinc.lg.geist.elevated`; the site also keeps the custom
        // properties the engine resolved them to (src/site/lib/theme.ts),
        // because deriving a base colour takes maths this script cannot carry.
        // They are written back only when they belong to the saved string.
        var saved = localStorage.getItem('klyv:theme') || ''
        var parts = saved.split('.')
        var boot = null
        try {
          boot = JSON.parse(localStorage.getItem('klyv-site:theme-boot') || 'null')
        } catch (error) {
          boot = null
        }
        var props = {}
        if (boot && boot.theme === saved && boot.props && boot.props.length) {
          for (var i = 0; i < boot.props.length; i++) {
            root.style.setProperty(boot.props[i][0], boot.props[i][1])
            props[boot.props[i][0]] = boot.props[i][1]
          }
          if (boot.font && /^https:\/\/fonts\.googleapis\.com\//.test(boot.font)) {
            var link = document.createElement('link')
            link.rel = 'stylesheet'
            link.href = boot.font
            link.setAttribute('data-klyv-font', '')
            document.head.appendChild(link)
          }
        } else if (parts.length === 5) {
          // No resolved copy: the radius needs no maths, so it still lands
          // before paint. The rest follows from restoreTheme in main.tsx.
          var scales = { none: 0, sm: 0.5, md: 0.75, lg: 1.25, xl: 1.5 }
          var custom = /^x(\d{1,3})$/.exec(parts[2])
          var scale = parts[2] in scales ? scales[parts[2]] : custom ? Math.min(3, custom[1] / 100) : null
          if (scale !== null) root.style.setProperty('--radius-scale', String(scale))
        }
        if (props['--base-light-canvas']) root.style.setProperty('--boot-canvas-light', props['--base-light-canvas'])
        if (props['--base-dark-canvas']) root.style.setProperty('--boot-canvas-dark', props['--base-dark-canvas'])
        if (props['--font-sans']) root.style.setProperty('--boot-font', props['--font-sans'])

        // The boot screen wears the remembered accent too, with whichever of
        // near-black or white reads on it. The theme's accent wins over one
        // saved by the older accent-only API.
        var accent = /^[0-9a-f]{6}$/i.test(parts[0]) && parts.length === 5 ? '#' + parts[0] : null
        accent = localStorage.getItem('klyv:accent') || accent
        if (accent && /^#[0-9a-f]{6}$/i.test(accent)) {
          var channel = function (i) {
            var c = parseInt(accent.slice(i, i + 2), 16) / 255
            return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)
          }
          var luminance = 0.2126 * channel(1) + 0.7152 * channel(3) + 0.0722 * channel(5)
          root.style.setProperty('--boot-accent', accent)
          root.style.setProperty('--boot-ink', luminance > 0.18 ? '#16200c' : '#ffffff')
        }
      } catch (error) {
        /* storage denied - fall through to the system preference */
      }
    </script>
    <style>
      /* The boot screen: painted before any script or stylesheet, and kept by
         React (components/BootScreen) while the first page's code loads. The
         values mirror the canvas and accent tokens in src/styles/tokens.css. */
      .boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: var(--boot-canvas-light, #f4f7f0);
      }
      :root[data-theme='dark'] .boot {
        background: var(--boot-canvas-dark, #0b0d0a);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .boot {
          background: var(--boot-canvas-dark, #0b0d0a);
        }
      }
      .boot-mark {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: calc(14px * var(--radius-scale, 1));
        background: var(--boot-accent, #c8f24e);
        color: var(--boot-ink, #16200c);
        font: 800 20px/1 var(--boot-font, 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif);
      }
      .boot-track {
        width: 112px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(128, 128, 128, 0.18);
      }
      .boot-fill {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: var(--boot-accent, #c8f24e);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-fill {
          width: 100%;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- React replaces this on its first render. Same markup as BootScreen. -->
      <div class="boot" role="status" aria-label="Loading Klyv">
        <span class="boot-mark" aria-hidden="true">K</span>
        <span class="boot-track" aria-hidden="true"><span class="boot-fill"></span></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
