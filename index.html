<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Citrine — an accent-led React component library</title>
    <meta
      name="description"
      content="290+ React components that take their entire personality from a single colour. Live previews, real source, copy and go."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Runs before the stylesheet paints, so a reader who chose dark never
      // sees a white flash first. Deliberately inline and dependency-free:
      // anything deferred is already too late.
      try {
        var mode = localStorage.getItem('citrine:mode')
        if (mode === 'dark' || mode === 'light') {
          document.documentElement.dataset.theme = mode
        }
        // The boot screen wears the remembered accent too, with whichever of
        // near-black or white reads on it.
        var accent = localStorage.getItem('citrine:accent')
        if (accent && /^#[0-9a-f]{6}$/i.test(accent)) {
          var channel = function (i) {
            var c = parseInt(accent.slice(i, i + 2), 16) / 255
            return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)
          }
          var luminance = 0.2126 * channel(1) + 0.7152 * channel(3) + 0.0722 * channel(5)
          document.documentElement.style.setProperty('--boot-accent', accent)
          document.documentElement.style.setProperty('--boot-ink', luminance > 0.18 ? '#16200c' : '#ffffff')
        }
      } catch (error) {
        /* storage denied - fall through to the system preference */
      }
    </script>
    <style>
      /* The boot screen: painted before any script or stylesheet, and kept by
         React (components/BootScreen) while the first page's code loads. The
         values mirror the canvas and accent tokens in src/styles/tokens.css. */
      .boot {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #f4f7f0;
      }
      :root[data-theme='dark'] .boot {
        background: #0b0d0a;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) .boot {
          background: #0b0d0a;
        }
      }
      .boot-mark {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: var(--boot-accent, #c8f24e);
        color: var(--boot-ink, #16200c);
        font: 800 20px/1 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
      }
      .boot-track {
        width: 112px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(128, 128, 128, 0.18);
      }
      .boot-fill {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: var(--boot-accent, #c8f24e);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes boot-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-fill {
          width: 100%;
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- React replaces this on its first render. Same markup as BootScreen. -->
      <div class="boot" role="status" aria-label="Loading Citrine">
        <span class="boot-mark" aria-hidden="true">C</span>
        <span class="boot-track" aria-hidden="true"><span class="boot-fill"></span></span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
