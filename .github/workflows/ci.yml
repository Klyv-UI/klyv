# The checks that used to run only when someone remembered to run them.
#
# Order matters: the cheap checks (types, the preset compile, generated data)
# finish in under a minute and catch the failures that are easiest to ship, so
# they gate the long suites rather than running beside them.
#
# On main, the last job deploys the docs site to Cloudflare (klyvui.xyz), and
# only once every check has passed. It needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   a token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the `klyv` Worker
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Re-run the checks, and on main the deploy, by hand from the Actions tab.
  workflow_dispatch:

# A new push to a pull request cancels its stale run. On main, runs queue
# instead, so a deploy is never cut off halfway by the merge after it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Types, preset and generated data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Types
        id: types
        run: npm run lint

      # The preset compiled to nothing for a while and nothing failed, because
      # an empty stylesheet is a valid stylesheet. See scripts/check-preset.mjs.
      - name: Preset compiles to real utilities
        id: preset
        run: npm run check:preset

      # `generate` rewrites data/ from the source. If the committed copies
      # differ, the docs, the CLI and the MCP server are describing a library
      # that no longer exists.
      - name: Generated data is current
        id: generated
        run: |
          npm run generate
          git diff --exit-code -- data src/site/data public \
            || { echo '::error::data/ is stale — run `npm run generate` and commit the result'; exit 1; }

      - name: Summary
        if: always()
        run: node scripts/ci-summary.mjs checks
        env:
          OUTCOMES: |
            Types=${{ steps.types.outcome }}
            Preset compiles to real utilities=${{ steps.preset.outcome }}
            Generated data is current=${{ steps.generated.outcome }}

  test:
    name: Unit, interaction and accessibility
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        id: tests
        run: npm test
      - name: Summary
        if: always()
        run: node scripts/ci-summary.mjs a11y
        env:
          OUTCOMES: |
            Preset, interaction, platform, axe and MCP suites=${{ steps.tests.outcome }}
      - name: Accessibility report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: a11y-report
          path: test/a11y-report.json
          if-no-files-found: ignore

  build:
    name: Package build
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the package
        id: build
        run: npm run build:lib

      # What the package actually resolves to for a consumer: entry points,
      # types, exports map. Reporting only for now — the exports map has known
      # gaps (no `require` condition), and a job that is red on day one teaches
      # people to ignore it. Make it gating once those are closed.
      - name: Package entry points
        id: publint
        continue-on-error: true
        run: npx --yes publint@latest run .

      - name: Summary
        if: always()
        run: node scripts/ci-summary.mjs package
        env:
          OUTCOMES: |
            Build the package=${{ steps.build.outcome }}
            Entry points (publint, reporting only)=${{ steps.publint.outcome }}

      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist

  browser:
    name: Browser checks (contrast)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # Contrast only. The visual baselines in e2e/visual.spec.ts-snapshots are
      # named for chromium-win32, so they read as missing on Linux and fail the
      # run. They need regenerating in this container before visual.spec.ts can
      # join in — until then, running it here would only teach people to ignore
      # a red job.
      - name: Contrast
        id: contrast
        run: npx playwright test e2e/contrast.spec.ts
      - name: Summary
        if: always()
        run: node scripts/ci-summary.mjs steps
        env:
          TITLE: Browser checks
          OUTCOMES: |
            Contrast=${{ steps.contrast.outcome }}
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  deploy:
    name: Deploy the docs site
    runs-on: ubuntu-latest
    needs: [test, build, browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site
        id: build
        run: npm run build

      # Real HTML for the pages a crawler or a link preview arrives at. The
      # site still renders in the browser; this is what is served before it does.
      - run: npx playwright install --with-deps chromium
      - name: Prerender the top pages
        id: prerender
        run: npm run prerender

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: node scripts/ci-summary.mjs site
        env:
          SITE_URL: ${{ steps.deploy.outcome == 'success' && 'https://klyvui.xyz' || '' }}
          OUTCOMES: |
            Build the site=${{ steps.build.outcome }}
            Prerender the top pages=${{ steps.prerender.outcome }}
            Deploy to Cloudflare=${{ steps.deploy.outcome }}
