# Deploys the docs site to Cloudflare Workers (klyvui.xyz) on every merge to main.
#
# Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   a token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the `klyv` Worker
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer merge replaces a queued one rather than racing it.
concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy the docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the site
        id: build
        run: npm run build

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: node scripts/ci-summary.mjs site
        env:
          SITE_URL: ${{ steps.deploy.outcome == 'success' && 'https://klyvui.xyz' || '' }}
          OUTCOMES: |
            Build the site=${{ steps.build.outcome }}
            Deploy to Cloudflare=${{ steps.deploy.outcome }}
