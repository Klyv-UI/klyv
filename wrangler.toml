# ============================================================
# KlyvUI - Cloudflare Workers Static Assets
# Website: https://klyvui.xyz
# ============================================================

name = "klyv"
compatibility_date = "2026-09-21"

# ============================================================
# Custom Domains
# ============================================================

routes = [
  { pattern = "klyvui.xyz", custom_domain = true },
  { pattern = "www.klyvui.xyz", custom_domain = true },
]

# ============================================================
# Static Assets Configuration
# ============================================================

[assets]
directory = "./dist-site"

# Unknown paths fall back to index.html
not_found_handling = "single-page-application"

# Avoid unnecessary trailing-slash redirects
html_handling = "drop-trailing-slash"


# ============================================================
# Cloudflare Observability
# ============================================================

[observability]
enabled = true

# 100% sampling initially
head_sampling_rate = 1


# ============================================================
# OpenTelemetry - Distributed Tracing
# ============================================================

[observability.traces]
enabled = true

# Must match the destination name in Cloudflare Dashboard
destinations = ["grafana-traces"]

# Capture 100% of traces initially
head_sampling_rate = 1


# ============================================================
# OpenTelemetry - Logs
# ============================================================

[observability.logs]
enabled = true

# Must match the destination name in Cloudflare Dashboard
destinations = ["grafana-logs"]

# Capture 100% of logs initially
head_sampling_rate = 1