# Cloudflare Workers static assets: the docs site at klyvui.xyz.
#
# `npm run build` writes the site to dist-site/. Unknown paths fall back to
# index.html, which is what the client-side router needs.
#
#   npm run build
#   wrangler deploy
name = "klyv"
compatibility_date = "2026-09-21"

routes = [
  { pattern = "klyvui.xyz", custom_domain = true },
  { pattern = "www.klyvui.xyz", custom_domain = true },
]

[assets]
directory = "./dist-site"
not_found_handling = "single-page-application"
# The prerendered pages are written as <route>/index.html, and the default
# handling answers /blocks with a 307 to /blocks/ — a redirect on every
# prerendered page, at a URL the sitemap and the canonical link do not use.
# Serve them at the path as written instead, and send /blocks/ to /blocks.
html_handling = "drop-trailing-slash"
